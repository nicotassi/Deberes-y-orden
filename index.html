};

  const d=parse(date),doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);

/* ---------- estado ---------- */
let S={code:null,pin:null,role:null,kid:'',kids:[],kidId:null,cfg:null,ev:[],tab:'hoy',day:today(),busy:false,err:''};
const isParent=()=>S.role==='parent';
const kidOf=id=>S.kids.find(k=>k.id===id);

const evKid=e=>e.kid||(S.kids[0]&&S.kids[0].id);

  const last=ls.get('dyo_kid');
  const id=r.role==='kid'?r.kid_id:(S.kidId&&r.kids.some(k=>k.id===S.kidId)?S.kidId:(r.kids.some(k=>k.id===last)?last:r.kids[0].id));setKid(id);syncAccts()}
const pending=()=>{const V=valid();return V.filter(e=>e.type==='redeem'&&!V.some(f=>f.type==='fulfill'&&f.ref===e.id))};

function valid(){ // eventos no anulados
  const dead=new Set(S.ev.filter(e=>e.type==='undo').map(e=>e.ref));
  return S.ev.filter(e=>e.type!=='undo'&&!dead.has(e.id)&&evKid(e)===S.kidId);
}
function tasksOn(date){
  const dow=parse(date).getDay(),t=today();
  return S.cfg.tasks.filter(k=>{
    if(!mine(k))return false;
    if(k.kind==='fija')return k.days.includes(dow)&&k.created<=date;
    if(k.date===date)return true;
    if(k.kind==='puntual'&&k.date<date&&date===t)return !doneAny(k.id); // atrasada
    return false});

function doneEv(taskId,date){const V=valid();return V.find(e=>e.type==='done'&&e.task===taskId&&e.d===date)}
function doneAny(taskId){return valid().some(e=>e.type==='done'&&e.task===taskId)}

function required(date){return tasksOn(date).filter(k=>k.kind!=='espontanea'&&!(k.kind==='puntual'&&k.date<date))}
function dayStat(date){const r=required(date),n=r.filter(k=>isDone(k,date)).length;return{n,total:r.length,complete:r.length>0&&n===r.length}}
function missedOn(d){return required(d).filter(k=>k.essential&&!isDone(k,d))}
const monOf=d=>addD(d,-((parse(d).getDay()+6)%7));
function penalties(){
  const t=today(),V=valid(),res=V.filter(e=>e.type==='penalty'),rules=S.cfg.penalties||[],out=[];
  const st=[S.cfg.startDate,(kidOf(S.kidId)||{}).since].filter(Boolean).sort().pop()||t,from=[st,addD(t,-14)].sort().pop();
  const pick=(m,per)=>rules.filter(r=>r.period===per&&m>=r.min&&(!r.kids||r.kids.includes(S.kidId))).sort((a,b)=>b.min-a.min)[0];
  const push=(key,per,m,label)=>{const r=pick(m,per);if(r)out.push({key,per,m,label,rule:r,res:res.find(x=>x.key===key&&x.rule===r.id)})};
  for(let d=from;d<t;d=addD(d,1)){const m=missedOn(d).length;if(m)push('D'+d,'day',m,fmtLong(d))}
  for(let w=monOf(from);w<=monOf(t);w=addD(w,7)){let m=0;const end=[addD(w,6),addD(t,-1)].sort()[0];

  for(let d=st;d<=t;d=addD(d,1)){const s=dayStat(d);if(s.complete){complete++;run++;longest=Math.max(longest,run)}else if(s.total===0){}else if(d!==t)run=0}
  // racha actual
  let d=t;if(!dayStat(d).complete)d=addD(d,-1);
  for(;d>=st;d=addD(d,-1)){const s=dayStat(d);if(s.complete)streak++;else if(s.total===0)continue;else break}
  const bonusDays=complete*(S.cfg.settings.dayBonus||0);
  const total=donePts+bonusDays;
  const spent=V.filter(e=>e.type==='redeem').reduce((a,e)=>a+(+e.cost||0),0);
  const doneN=V.filter(e=>e.type==='done').length;
  return{total,balance:total-spent,spent,streak,longest,complete,doneN,lvl:levelOf(total),bonusDays}
}

function toggle(id,ev){
  if(isParent())return;
  const k=S.cfg.tasks.find(x=>x.id===id),d=S.day,e=doneEv(id,d)||(k.kind!=='fija'&&valid().find(y=>y.type==='done'&&y.task===id));
  if(e){if(!isParent()&&e.d!==today()){toast('Solo se puede deshacer lo de hoy');return}sendEvent({type:'undo',ref:e.id});return}
  if(!isParent()&&d!==today()){toast('Solo podés completar las tareas de hoy 😉');return}
  const wasComplete=dayStat(d).complete,before=stats();
  sendEvent({type:'done',task:id,d,pts:k.pts,title:k.title,emoji:k.emoji,cat:k.cat});
  const r=ev.clientX?ev:{clientX:innerWidth/2,clientY:innerHeight/2};confetti(r.clientX,r.clientY);
  const a=stats();
  if(!wasComplete&&dayStat(d).complete){setTimeout(()=>{confetti(innerWidth/2,innerHeight/2);toast('🎉 ¡Día perfecto!')},300)}

}

function viewProgreso(){
  const s=stats(),t=today(),days=[];
  for(let i=6;i>=0;i--){const d=addD(t,-i),st=dayStat(d);days.push({d,pct:st.total?Math.round(st.n/st.total*100):0,st})}
  const bars=days.map(x=>`<div><small>${x.st.total?x.pct+'%':'–'}</small><i style="height:${Math.max(3,x.pct)}px"></i>${DN[parse(x.d).getDay()]}</div>`).join('');
  const week=days.filter(x=>x.st.total),avg=week.length?Math.round(week.reduce((a,x)=>a+x.pct,0)/week.length):0;
  // heatmap 5 semanas
  const start=addD(t,-34),pre=(parse(start).getDay()+6)%7;let cells='';
  for(let i=0;i<pre;i++)cells+='<span style="visibility:hidden"></span>';
  for(let i=0;i<35;i++){const d=addD(start,i),st=dayStat(d),c=!st.total?'':st.complete?'h3':st.n/st.total>=.5?'h2':st.n?'h1':'';cells+=`<span class="${c}">${parse(d).getDate()}</span>`}
  const V=valid().filter(e=>e.type==='done'&&e.d>=addD(t,-29)),cat={};
  V.forEach(e=>cat[e.cat||'otro']=(cat[e.cat||'otro']||0)+1);
  const mx=Math.max(1,...Object.values(cat));
  const cb=Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<div class="row" style="margin:6px 0"><span style="width:110px">${CATS[c]?.e||'⭐'} ${CATS[c]?.n||c}</span><div class="sp bar d"><i style="width:${n/mx*100}%"></i></div><b>${n}</b></div>`).join('')||'<p class="mute">Todavía no hay datos.</p>';
  const bd=BADGES.map(b=>`<div class="badge ${b[2](s)?'':'off'}"><b>${b[0]}</b>${b[1]}</div>`).join('');
  return`<div class="wrap"><h2>📊 Progreso de ${esc(S.kid)}</h2>
  <div class="grid" style="margin-top:12px"><div class="stat">🔥<b>${s.streak}</b>racha actual</div><div class="stat">🏆<b>${s.longest}</b>mejor racha</div><div class="stat">⭐<b>${s.total}</b>puntos totales</div><div class="stat">✅<b>${s.doneN}</b>tareas hechas</div><div class="stat">📅<b>${s.complete}</b>días perfectos</div><div class="stat">${s.lvl.em}<b style="font-size:16px">${s.lvl.name}</b>nivel ${s.lvl.i+1}</div></div>
  <div class="card"><h3>Últimos 7 días <span class="mute">· promedio ${avg}%</span></h3><div class="bars" style="margin-top:14px">${bars}</div></div>
  <div class="card"><h3>Calendario (5 semanas)</h3><div class="heat" style="margin:6px 0 4px">${['L','M','M','J','V','S','D'].map(x=>`<small class="mute" style="text-align:center">${x}</small>`).join('')}</div><div class="heat">${cells}</div><div class="mute" style="margin-top:8px">🟩 día perfecto · 🟪 más de la mitad · 🟦 algo</div></div>
  <div class="card"><h3>Qué hace más (30 días)</h3>${cb}</div>
  <div class="card"><h3>🏅 Logros</h3><div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:10px">${bd}</div></div>
  ${isParent()?historyCard():''}</div>`;
}
function historyCard(){
  const V=valid().filter(e=>['done','extra','bonus','redeem'].includes(e.type)).slice(-30).reverse();
  const row=e=>{const dt=new Date(e.ts||0),h=`${DN[dt.getDay()]} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
    const txt=e.type==='done'?`${e.emoji||''} ${esc(e.title)} <b class="pts">+${e.pts}</b>`:e.type==='extra'?`🌟 Extra: ${esc(e.note)} <b class="pts">+${e.pts}</b>`:e.type==='bonus'?`🎁 ${esc(e.note||'Bonus')} <b class="pts">${e.pts>0?'+':''}${e.pts}</b>`:`🛍️ Canje: ${esc(e.name)} <b class="pts">-${e.cost}</b>`;
    return`<div class="ev"><span class="mute" style="width:78px">${h}</span><span class="sp">${txt}</span><button class="sm ghost" onclick="sendEvent({type:'undo',ref:'${e.id}'})">Anular</button></div>`};
  return`<div class="card"><h3>🕵️ Últimos movimientos</h3><p class="mute">Si algo no corresponde, anulalo y se resta.</p>${V.map(row).join('')||'<p class="mute">Sin movimientos.</p>'}</div>`;
}

function syncTF(){const g=id=>document.getElementById(id);if(g('tt')){TF.title=g('tt').value;TF.emoji=g('te').value;TF.pts=+g('tp').value;TF.cat=g('tc').value;TF.time=g('tm').value;if(g('td'))TF.date=g('td').value;const ks=readKids();if(document.querySelector('.tk'))TF.kids=ks;if(g('tess'))TF.essential=g('tess').checked}}
function saveTask(){syncTF();if(!TF.title.trim()){toast('Poné un nombre');return}
  if(TF.kids&&!TF.kids.length){toast('Elegí para quién');return}

  const o={title:TF.title.trim(),emoji:TF.emoji||'⭐',cat:TF.cat,kind:TF.kind,days:TF.days,time:TF.time,pts:Math.max(1,TF.pts||1),date:TF.kind==='fija'?null:(TF.date||today()),kids:TF.kids||null,essential:TF.kind!=='espontanea'&&!!TF.essential};
  if(TF.id)Object.assign(S.cfg.tasks.find(x=>x.id===TF.id),o);else S.cfg.tasks.push({id:uid(),created:today(),...o});
  closeModal();saveCfg()}
function delTask(){if(!confirm('¿Borrar esta tarea? El historial se mantiene.'))return;S.cfg.tasks=S.cfg.tasks.filter(x=>x.id!==TF.id);closeModal();saveCfg()}

  const o={min:Math.max(1,+$('#rm').value||1),period:$('#rp').value,text:t,kids:ks};S.cfg.penalties=S.cfg.penalties||[];
  if(id)Object.assign(S.cfg.penalties.find(x=>x.id===id),o);else S.cfg.penalties.push({id:uid(),...o});closeModal();saveCfg()}
function delRule(id){if(!confirm('¿Borrar regla?'))return;S.cfg.penalties=S.cfg.penalties.filter(x=>x.id!==id);closeModal();saveCfg()}
function avatarModal(id){const cur=kidAv(id);
  modal(`<h3 style="text-align:center">Icono de ${esc((kidOf(id)||{}).name)}</h3><div class="pick">${PICK.map(e=>`<button class="${e===cur?'on':''}" onclick="setAvatar('${id}','${e}')">${e}</button>`).join('')}</div>`)}
function setAvatar(id,e){S.cfg.avatars=S.cfg.avatars||{};S.cfg.avatars[id]=e;closeModal();syncAccts();saveCfg();toast('Icono cambiado '+e)}
function saveMsgs(){S.cfg.messages=S.cfg.messages||{};document.querySelectorAll('.mi').forEach(i=>{S.cfg.messages[i.dataset.k]={text:i.value.trim(),date:today()}});saveCfg();toast('Mensajes guardados')}
async function renameKid(id){const n=prompt('Nuevo nombre',(kidOf(id)||{}).name);if(!n||!n.trim())return;try{await rpc('dyo2_rename_kid',{p_code:S.code,p_pin:S.pin,p_kid:id,p_name:n});await refresh();render();toast('Listo ✅')}catch(x){toast('⚠️ '+errMsg(x))}}
function addKidModal(){modal(`<h3>➕ Agregar hijo/a</h3><label>Nombre</label><input id="an" placeholder="Benjamín"><label>PIN (4+ números, distinto a los demás)</label><input id="ap" type="password" inputmode="numeric"><p></p><button class="pri" style="width:100%" onclick="addKid()">Agregar</button>`)}
async function addKid(){try{const id=await rpc('dyo2_add_kid',{p_code:S.code,p_pin:S.pin,p_name:$('#an').value,p_kid_pin:$('#ap').value});closeModal();saveKidAcct(S.code,id,$('#an')?$('#an').value.trim():'Hijo/a',$('#ap')?$('#ap').value.trim():null);await refresh();setKid(id);S.tab='tareas';render();toast('¡Agregado! Asignale tareas 👇')}catch(x){toast('⚠️ '+errMsg(x))}}
function pinModal(w){modal(`<h3>Nuevo PIN ${w==='parent'?'de papás':'de '+esc((kidOf(w)||{}).name)}</h3><input id="np" type="password" inputmode="numeric" placeholder="4+ números"><p></p><button class="pri" style="width:100%" onclick="chPin('${w}')">Cambiar</button>`)}
async function chPin(w){const n=$('#np').value.trim();try{await rpc('dyo2_change_pin',{p_code:S.code,p_pin:S.pin,p_which:w,p_new:n});if(w==='parent'){S.pin=n;ls.set('dyo_auth',{code:S.code,pin:n})}closeModal();toast('PIN cambiado ✅')}catch(x){toast('⚠️ '+errMsg(x))}}
function setTheme(v){ls.set('dyo_theme',v);applyTheme();render()}
function applyTheme(){const v=ls.get('dyo_theme','auto');const dark=v==='dark'||(v==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light'}

function modal(h){closeModal();const m=document.createElement('div');m.className='modal';m.innerHTML=`<div>${h}</div>`;m.onclick=e=>{if(e.target===m)closeModal()};document.body.appendChild(m)}
function closeModal(){document.querySelectorAll('.modal').forEach(m=>m.remove())}

function render(){
  const app=$('#app');
  if(!S.code){app.innerHTML=viewLogin();return}
  if(!S.cfg){app.innerHTML='<div class="center">Cargando…</div>';return}
  const tabs=isParent()?[['hoy','🏠','Hoy'],['tareas','📋','Tareas'],['progreso','📊','Progreso'],['premios','🎁','Premios'],['ajustes','⚙️','Ajustes']]:[['hoy','🏠','Hoy'],['progreso','📊','Progreso'],['premios','🎁','Premios'],['ajustes','⚙️','Ajustes']];
  const V={hoy:viewHoy,tareas:viewTareas,progreso:viewProgreso,premios:viewPremios,ajustes:viewAjustes}[S.tab]||viewHoy;
  const who=isParent()?{n:'Papás',av:'👨‍👩‍👧',c:'#3b2f77',sub:S.kids.length>1&&['hoy','progreso','premios'].includes(S.tab)?'viendo a '+S.kid:'sesión de'}:{n:S.kid,av:kidAv(S.kidId),c:kidColor(S.kidId),sub:'sesión de'};
  app.innerHTML=`<div class="who" style="background:${who.c}"><span class="wav">${who.av}</span><div class="sp"><small>${who.sub}</small><b>${esc(who.n)}</b></div><button class="sm" style="background:rgba(255,255,255,.22);color:#fff" onclick="setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')">${document.documentElement.dataset.theme==='dark'?'☀️':'🌙'}</button></div>${['hoy','progreso','premios'].includes(S.tab)?kidBar():''}${V()}<nav>${tabs.map(([k,e,n])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';S.day=today();render();scrollTo(0,0)"><b>${e}</b>${n}</button>`).join('')}</nav>`;
}

/* ---------- instalar como app ---------- */
let DP=null;
const standalone=()=>matchMedia('(display-mode:standalone)').matches||navigator.standalone;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
function installBanner(){
  if(standalone()||ls.get('dyo_inst_no')===today()||document.querySelector('.inst'))return;
  if(!DP&&!isIOS())return;
  const b=document.createElement('div');b.className='inst';
  b.innerHTML=`<div class="row"><img src="icon.svg" width="48" height="48" style="border-radius:12px"><div class="sp"><b>Instalá la app en tu teléfono</b><div class="mute">${DP?'Un toque y queda como cualquier app.':'Tocá <b>Compartir</b> ⬆️ y después <b>“Agregar a inicio”</b>.'}</div></div></div><div class="row" style="margin-top:10px">${DP?'<button class="pri sp" id="ib">Instalar</button>':''}<button class="ghost sp" id="ix">Ahora no</button></div>`;
  document.body.appendChild(b);
  $('#ix').onclick=()=>{ls.set('dyo_inst_no',today());b.remove()};
  if(DP)$('#ib').onclick=async()=>{DP.prompt();await DP.userChoice;DP=null;b.remove()};
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;installBanner()});
addEventListener('appinstalled',()=>{document.querySelector('.inst')?.remove()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
setTimeout(installBanner,1500);

/* ---------- inicio ---------- */
applyTheme();matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{applyTheme();render()});
(async()=>{
  const a=ls.get('dyo_auth');
  if(a){S.code=a.code;S.pin=a.pin;const c=ls.get('dyo_cache');if(c&&c.kids){S.cfg=c.cfg;S.ev=c.ev;S.kids=c.kids;S.role=c.role;setKid(c.kidId)}render();await refresh(true)}
  else render();
  setInterval(()=>{if(!document.hidden)refresh(true)},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(true)});
})();
</script>
</body>
</html>
